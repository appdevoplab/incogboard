# Wave 5 (security audit) pins every action to a commit SHA.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --line-length 120 --output=none --set-exit-if-changed lib test pigeons
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Release build (per ABI)
        run: flutter build apk --release --split-per-abi
      - name: Privacy gate - no network permission
        run: bash tool/check_release_permissions.sh build/app/outputs/flutter-apk/*-release.apk
